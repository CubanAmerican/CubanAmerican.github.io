{n:'Correo seguro (personal)',a:47.88,m:2,e:1},{n:'App de diseño (personal)',a:95.88,m:2,e:1},{n:'App de voz IA (personal)',a:240,m:3,e:1},{n:'Periódico (mar)',a:99,m:3,e:1},{n:'Periódico (sep)',a:99,m:9,e:1},{n:'Seguro anual (no visto)',a:0,m:1,e:1}];

items:DEFITEMS(),
inc:[{n:'Ingreso fijo',a:1500,d:1}],newRent:{ym:'',a:''},jobs:[],act:{},paid:{},put:{},avail:{}}}

function remainingIn(ym,mode){let fi=S.inc.reduce((a,x,i)=>a+(ym==cm&&isPaid('inc'+i,ym)?0:+x.a||0),0);return fi+jobsInc(ym,mode)}

$('main').innerHTML=(S.notice5?`<div class=card style="background:#e8f4ff;border:1px solid #9cc"><b>✓ Actualicé montos/fechas verificados</b><br><small>${esc(S.notice5)}</small><br><button class="btn s" onclick="S.notice5='';save();render()">Entendido</button></div>`:'')+({hoy:vHoy,pri:vPri,mes:vMes,ing:vIng,tra:vTra,pro:vPro,aj:vAj,mas:vMas,imp:vImp})[tab]()}

const unpaid=its.filter(x=>!isPaid(x.id,ym)).length;return unpaid==0?'var(--g)':(ym==cm?'var(--y)':'#9aa')}

function vPri(){const ym=sel,P=S.put[ym]||{};let h=printBar()+impBtn()+`<div class="msel">${months.map(m=>`<button class="${m==ym?'on':''}" onclick="sel='${m}';render()">${ml(m)}</button>`).join('')}</div>`;

${firstGap>=0&&tP>0?`<div class=warn>El dinero se acaba en la fila ${firstGap+1}: ${esc(S.items[firstGap].n)}. Las filas en rojo quedan sin cubrir.</div>`:tP>0?'<div class=ok>✓ Todo cubierto</div>':''}</div>

(sortDue?S.items.map((x,i)=>[x,i]).sort((a,b)=>(a[0].d||99)-(b[0].d||99)):S.items.map((x,i)=>[x,i])).forEach(([x,i])=>{const di=dueInfo(x,ym),cdb=isCard(x.n)?(+S.cardDebt[x.n]||0):0;const d=bud(x,ym),p=+P[x.id]||0,fa=d-p,unc=fa>0.005&&(tP>0||av!=='');
h+=`<div class="pr ${unc?'unc':''}" style="border-left:4px solid ${TC[x.t]}"><span class=num>${i+1}</span><span class=pn><input class=nm value="${esc(x.n)}" onchange="gi('${x.id}').n=this.value;gi('${x.id}').ed=1;save()"><span style="font-size:12px;color:${di.c||'#667'};display:flex;align-items:center;gap:4px">vence día <input type=number inputmode=numeric min=1 max=31 value="${x.d||''}" placeholder="–" onchange="setD('${x.id}',this.value);render()" style="width:46px;font-size:15px;padding:3px;border:1px solid #ccd;border-radius:6px;text-align:center"> ${di.t.split('·')[1]?'· '+di.t.split('·')[1]:''}</span>${fxB(x)}${rentUI(x)}<span style="display:none"></span>${cdb?`<small class=note>Deuda nueva por imprevistos: +${f(cdb)}</small>`:''}${x.note?`<small class=note>${esc(x.note)}</small>`:''}</span>
<input type=number inputmode=decimal value="${d}" onchange="setB('${x.id}',this.value)" aria-label="Debo" class=cd>
<input type=number inputmode=decimal value="${P[x.id]??''}" placeholder="0" onchange="setPut('${x.id}',this.value)" aria-label="Pongo" class=cp>
<b class="cf ${fa>0.005?'neg':'pos'}">${f(fa)}</b><span class=mv><button onclick="mv(${i},-1)" aria-label="subir">▲</button><button onclick="mv(${i},1)" aria-label="bajar">▼</button><button onclick="delItem('${x.id}')" aria-label="eliminar">✕</button></span></div>`});

const impCash=ym=>(S.imp||[]).filter(x=>x.ym==ym&&!isCard(x.fp)).reduce((a,x)=>a+(+x.a||0),0);
const impCard=ym=>(S.imp||[]).filter(x=>x.ym==ym&&isCard(x.fp)).reduce((a,x)=>a+(+x.a||0),0);
const cardNew=n=>(S.imp||[]).filter(x=>x.fp==n).reduce((a,x)=>a+(+x.a||0),0);
let showImp=false,sortDue=false;
function dueInfo(x,ym){if(!x.d)return{t:'',c:''};if(ym!=cm)return{t:'vence día '+x.d,c:'#667'};if(isPaid(x.id,ym))return{t:'vence día '+x.d+' · pagado',c:'#1a8a3f'};
const dd=x.d-now.getDate();if(dd<0)return{t:'vence día '+x.d+' · VENCIDO',c:'#c62828'};if(dd<=5)return{t:'vence día '+x.d+' · en '+dd+' días',c:'#e07b00'};return{t:'vence día '+x.d,c:'#556'}}
function impBtn(){return `<button class=btn style="width:100%;background:#b23c17;margin-bottom:10px" onclick="showImp=!showImp;render()">${showImp?'Cerrar':'+ Gasto imprevisto'}</button>${showImp?impForm():''}`}
function impForm(){return `<div class=card><h2>Nuevo gasto imprevisto</h2><div class=row><input class=t id=idesc placeholder="Descripción"><label class=f>Monto $<input id=ia type=number inputmode=decimal></label><input class=t type=date id=idt value="${new Date().toISOString().slice(0,10)}">
<select class=t id=icat>${['Camioneta','Comida','Salud','Herramientas/material','Trabajo','Personal','Otro'].map(c=>`<option>${c}</option>`).join('')}</select>
<select class=t id=ifp>${S.fps.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
<button class=btn style="width:100%;margin-top:8px" onclick="addImp()">Guardar imprevisto</button><small>Si es con tarjeta, no sale del efectivo: se suma a la deuda de esa tarjeta.</small></div>`}
function addImp(){const a=+$('ia').value;if(!a)return alert('Escriba el monto');const dt=$('idt').value||new Date().toISOString().slice(0,10),fp=$('ifp').value;
S.imp.push({id:'m'+Date.now(),dt,ym:dt.slice(0,7),desc:$('idesc').value||'Imprevisto',a,cat:$('icat').value,fp});if(isCard(fp))S.cardDebt[fp]=(+S.cardDebt[fp]||0)+a;showImp=false;save();render()}
function delImp(id){const x=S.imp.find(y=>y.id==id);if(!x||!confirm('¿Borrar imprevisto?'))return;if(isCard(x.fp))S.cardDebt[x.fp]=Math.max(0,(+S.cardDebt[x.fp]||0)-x.a);S.imp=S.imp.filter(y=>y.id!=id);save();render()}
function impList(ym){const L=S.imp.filter(x=>x.ym==ym);if(!L.length)return `<div class=card><h2>Imprevistos de ${ml(ym)}</h2><small>Ninguno.</small></div>`;const by={};L.forEach(x=>by[x.fp]=(by[x.fp]||0)+x.a);
return `<div class=card><h2>Imprevistos de ${ml(ym)}<span>${f(L.reduce((a,x)=>a+x.a,0))}</span></h2>${L.map(x=>`<div class=l1 style="padding:6px 0;border-top:1px solid #eef"><span class=n style="white-space:normal">${esc(x.desc)}<br><small style="color:#667;font-weight:400">${x.dt} · ${esc(x.cat)} · ${esc(x.fp)}</small></span><b>${f(x.a)}</b><button class=del onclick="delImp('${x.id}')">✕</button></div>`).join('')}
<div style="margin-top:6px;font-size:13px"><b>Por forma de pago:</b>${Object.keys(by).map(k=>`<div class=tot><span>${esc(k)}${isCard(k)?' (deuda)':''}</span><b>${f(by[k])}</b></div>`).join('')}</div>
<div class=tot><span>Sale del efectivo</span><b class=neg>${f(impCash(ym))}</b></div><div class=tot><span>Cargado a tarjetas</span><b>${f(impCard(ym))}</b></div></div>`}

// ===== pestaña Imprimir =====
const PSECS=[['hoy','Hoy'],['pri','Prioridad'],['ing','Ingresos y trabajos'],['pro','Proyección'],['imp','Imprevistos'],['anu','Calendario anual']];
function secHTML(k){const keep=tab;let h='';try{tab=k;
if(k=='hoy')h=vHoy0();else if(k=='pri')h=vPri();else if(k=='ing')h=vIng()+vTra0();else if(k=='pro')h=vPro();
else if(k=='imp'){const ms=[...new Set((S.imp||[]).map(x=>x.ym))].sort();h=ms.length?ms.map(impList).join(''):'<div class=card><small>No hay imprevistos registrados.</small></div>'}
else if(k=='anu'){const an=S.annual||[];h=`<div class=card><table><tr><th>Gasto</th><th>Monto/año</th><th>Vence</th><th>Apartar/mes</th></tr>${an.map(x=>`<tr><td>${esc(x.n)}</td><td>${f(+x.a||0)}</td><td>${MN[(x.m||1)-1].toLowerCase()}</td><td>${f((+x.a||0)/12/(x.e||1))}${(x.e||1)>1?' <small>(c/'+x.e+' años)</small>':''}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${f(an.reduce((a,x)=>a+(+x.a||0),0))}</b></td><td></td><td><b>${f(an.reduce((a,x)=>a+(+x.a||0)/(x.e||1),0)/12)}</b></td></tr></table></div>`}}finally{tab=keep}return h}
function buildPrint(){S.psel=S.psel||{hoy:1,pri:1,ing:1,pro:1,imp:1,anu:1};const box=document.createElement('div');box.innerHTML=printHead(false);
PSECS.filter(([k])=>S.psel[k]).forEach(([k,n])=>{const sec=document.createElement('section');sec.className='psec';sec.innerHTML=`<h2 class=pt>${n}</h2>`+secHTML(k);box.appendChild(sec)});staticize(box);return box}
function vImp(){S.psel=S.psel||{hoy:1,pri:1,ing:1,pro:1,imp:1,anu:1};const L=projMonths();
setTimeout(()=>{const pv=document.getElementById('pprev');if(pv){pv.innerHTML='';pv.appendChild(buildPrint())}},0);
return `<div class=card><h2>Imprimir / Guardar PDF</h2><div class=mgrid>${PSECS.map(([k,n])=>`<label style="display:flex;gap:8px;align-items:center;font-size:15px;min-height:40px"><input type=checkbox style="width:26px;height:26px" ${S.psel[k]?'checked':''} onchange="S.psel['${k}']=this.checked?1:0;save();render()">${n}</label>`).join('')}</div>
<div class=tot><span>Escenario</span><b>${SC[S.pr.scen][0]}</b></div><div class=tot><span>Meses</span><b>${ml(L[0])} – ${ml(L[L.length-1])}</b></div><small>Escenario y meses se cambian en Proyección.</small>
<button class=btn style="width:100%;font-size:18px;margin-top:10px;min-height:56px" onclick="printNow()">🖨️ Imprimir / Guardar PDF</button>
<small>En iPhone: se abre la pantalla de imprimir de Safari → Imprimir, o toque Compartir → Guardar en Archivos (PDF).</small></div>
<div class=card><h2>Vista previa</h2><div id=pprev class=pprev></div></div>`}
function printNow(){const b=document.getElementById('printbox');b.innerHTML='';b.appendChild(buildPrint());document.body.classList.add('printing');setTimeout(()=>window.print(),80)}

load();render();
</script></body></html>
